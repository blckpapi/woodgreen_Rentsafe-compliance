name: WoodGreen portfolio monitor
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor.yml'
      - 'lib/city.ts'
      - 'lib/portfolio.ts'
      - 'scripts/monitor.ts'
permissions:
  contents: write
concurrency:
  group: woodgreen-portfolio-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify City sources and record changes
        id: monitor
        continue-on-error: true
        run: node --experimental-strip-types scripts/monitor.ts
      - name: Save public monitoring results
        run: |
          git config user.name 'WoodGreen Portfolio Monitor'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/monitor.json
          if ! git diff --cached --quiet; then
            git commit -m 'monitor: refresh WoodGreen public City records'
            git push
          fi
      - name: Report source failure
        if: steps.monitor.outcome == 'failure'
        run: exit 1
